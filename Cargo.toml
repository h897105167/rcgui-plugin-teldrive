[package]
name = "rcgui-plugin-teldrive"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/h897105167/rcgui-plugin-teldrive"
description = "RCGUI 插件：一键部署 teldrive、登录 Telegram、建频道与机器人、创建 remote 并挂载"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
